[workspace]
resolver = "2"
members = ["crates/aw-core", "crates/aw-mcp", "crates/aw-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/daejun/agentwiki"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
regex = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
